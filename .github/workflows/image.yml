# Build the catalog's image and push it to GitHub's container registry.
#
# The image is what runs in production: Railway pulls
# ghcr.io/logicsrc/openmcp rather than building the Dockerfile itself, so a
# broken hosted builder cannot stop a deploy, and the image that was tested
# is the image that ships. Every push gets a tag of its commit; main also
# moves `latest`, and a release tag (v0.2.0) also moves its version.
name: image

on:
  push:
    branches: [main, "worktree-*"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/logicsrc/openmcp
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
